<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Back2You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=20261018-2" />
  <link rel="stylesheet" href="/css/browse.css" />
  <link rel="stylesheet" href="/css/responsive.css?v=20261017-5" />
  <script src="/js/main.js?v=20261017-5"></script>
</head>
<body>
  <div id="navMount"></div>

  <div class="page-header">
    <h1>📋 Browse Items</h1>
    <p>Search and filter lost &amp; found items reported on campus.</p>
  </div>

  <div class="page-section" style="padding-top:0;">

    <!-- Type Tabs -->
    <div class="type-tabs">
      <button class="type-tab active" data-type="all">All Items</button>
      <button class="type-tab" data-type="lost">🔍 Lost</button>
      <button class="type-tab" data-type="found">📦 Found</button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-group search-wrap">
        <label>Search</label>
        <div class="search-input-wrap">
          <span class="search-icon">🔍</span>
          <input type="text" class="form-control" id="searchInput" placeholder="Search by item name, description…" />
        </div>
      </div>
      <div class="filter-group">
        <label>Category</label>
        <select class="form-control" id="filterCategory">
          <option value="">All Categories</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Location</label>
        <select class="form-control" id="filterLocation">
          <option value="">All Locations</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Status</label>
        <select class="form-control" id="filterStatus">
          <option value="">All Statuses</option>
          <option value="lost">Lost</option>
          <option value="found">Found</option>
          <option value="claimed">Claimed</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;">
        <button class="btn btn-outline" id="clearFilters" style="padding:.6rem 1.1rem;font-size:.82rem;">Clear</button>
      </div>
    </div>

    <!-- Results -->
    <div class="results-header">
      <div class="results-count" id="resultsCount"></div>
      <select class="sort-select" id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>
    </div>

    <div class="browse-grid" id="browseGrid"></div>
    <div class="items-pagination" id="itemsPagination" aria-label="Items pagination"></div>

  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-left">
        <p>CSPC Lost &amp; Found System</p>
        <p>Camarines Sur Polytechnic Colleges</p>
      </div>
      <div class="footer-right">
        <p>Nabua, Camarines Sur</p>
      </div>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/browse.js"></script>
  <script src="/icons.js"></script>
</body>
</html>
